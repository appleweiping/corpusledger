[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corpusledger"
version = "0.1.0"
description = "Reproducible manifests and auditable diffs for JSON NLP corpora"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Wei Ping"}]
keywords = ["nlp", "dataset", "provenance", "reproducibility", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "coverage[toml]>=7.6", "mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[project.scripts]
corpusledger = "corpusledger.cli:main"

[project.urls]
Documentation = "https://github.com/appleweiping/corpusledger#readme"
Issues = "https://github.com/appleweiping/corpusledger/issues"
Source = "https://github.com/appleweiping/corpusledger"

[tool.hatch.build.targets.wheel]
packages = ["src/corpusledger"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["corpusledger"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["corpusledger"]
