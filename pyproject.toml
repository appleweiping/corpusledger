[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corpusledger"
version = "0.3.0"
description = "See which records and fields changed between two versions of a JSON, JSONL, CSV or Parquet dataset"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Weiping Yan"}]
keywords = ["dataset", "diff", "jsonl", "parquet", "data-versioning", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["mypy>=1.11", "pyarrow>=12", "pytest>=8", "ruff>=0.8"]

[project.scripts]
corpusledger = "corpusledger.cli:main"

[project.urls]
Source = "https://github.com/appleweiping/corpusledger"
Issues = "https://github.com/appleweiping/corpusledger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/corpusledger"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
ignore_missing_imports = true
