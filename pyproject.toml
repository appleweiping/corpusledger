[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corpusledger"
version = "0.2.0"
description = "Reproducible manifests and auditable diffs for JSON NLP corpora"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Wei Ping"}]
keywords = ["nlp", "dataset", "provenance", "reproducibility", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=43"]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "coverage[toml]>=7.6",
  "cryptography>=43",
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5",
]

[project.scripts]
corpusledger = "corpusledger.cli:main"

[project.urls]
Changelog = "https://github.com/appleweiping/corpusledger/blob/main/CHANGELOG.md"
Discussions = "https://github.com/appleweiping/corpusledger/discussions"
Documentation = "https://github.com/appleweiping/corpusledger#readme"
Issues = "https://github.com/appleweiping/corpusledger/issues"
Source = "https://github.com/appleweiping/corpusledger"

[tool.hatch.build.targets.wheel]
packages = ["src/corpusledger"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/benchmarks",
  "/docs",
  "/examples",
  "/scripts",
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/MAINTAINERS.md",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=corpusledger --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["corpusledger"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["corpusledger"]

[tool.bandit]
targets = ["src"]
# B101: the two flagged asserts (`manifest.py` file_hasher, `readers.py` id text)
# are static narrowings that keep mypy strict happy after an explicit check has
# already run. Untrusted corpus input is always rejected with an explicit
# `raise InputError(...)`, never by an assert, so stripping asserts under
# `python -O` removes no validation.
skips = ["B101"]
